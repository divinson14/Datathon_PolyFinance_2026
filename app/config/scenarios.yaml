# « Et si… » : LISTE BLANCHE des paramètres du mandat qu'un utilisateur peut modifier (choix de l'équipe,
# voir docs/decisions.md). Une seule modification par « Et si », toujours à partir de l'analyse d'ORIGINE.
# Un bouton est MASQUÉ quand il serait sans effet (voir « masque_si »).
parametres:
  tolerance:
    type: gabarit
    # ordre croissant de risque ; ce sont les clés de gabarits_risque.yaml
    valeurs_permises: [faible_a_modere, modere, eleve]
    regle: niveau_suivant
    bouton: "Et si j'acceptais plus de risque ?"
    effet: "autre gabarit de tolérance : les limites sont recalculées"
    masque_si: "déjà au niveau de tolérance le plus élevé"
  part:
    type: part
    regle: facteur
    facteur: 0.5
    part_min: 0.005          # en dessous d'un demi-point (pas de la grille du point de bascule) : bouton masqué
    bouton: "Et si je mettais moitié moins ?"
    effet: "nouvelle part analysée ; les limites ne changent pas"
    masque_si: "la moitié de la part serait inférieure à 0,5 point"
  horizon:
    type: annees
    regle: valeur_fixe
    valeur: 10
    min: 1
    max: 50
    bouton: "Et si mon horizon était de 10 ans ?"
    effet: "les limites ne changent pas (elles dépendent de la tolérance, pas de l'horizon) ; seules les tensions sont recalculées"
    masque_si: "l'horizon actuel inclut déjà 10 ans"
