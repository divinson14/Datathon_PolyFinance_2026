# Seuils fixés par l'ÉQUIPE (jamais par le LLM). Chaque valeur est une HYPOTHÈSE documentée,
# affichée comme telle à l'utilisateur. Justification : docs/decisions.md.
#
# « Titre » = action individuelle ou cryptoactif (classes equity / crypto). Les FNB diversifiés
# ne sont pas soumis aux limites par titre : un FNB obligataire à 30 % n'est pas une concentration.
#
# poids_max_par_titre          part des DOLLARS dans un seul titre
# part_risque_max_par_titre    part du RISQUE (contribution à la variance) portée par un seul titre
# volatilite_max               volatilité annualisée du portefeuille (rendements hebdomadaires en CAD)
# pire_baisse_max              pire baisse du sommet au creux sur la fenêtre complète (5 ans)
# obligations_min              part minimale en FNB obligataires
# crypto_max                   part maximale en cryptoactifs
# paris_effectifs_min          nombre minimal de « paris indépendants » (null = non vérifié)
faible_a_modere:
  label: "Faible à modéré"
  poids_max_par_titre: 0.10
  part_risque_max_par_titre: 0.20
  volatilite_max: 0.08
  pire_baisse_max: -0.12
  obligations_min: 0.40
  crypto_max: 0.0
  paris_effectifs_min: null
modere:
  label: "Modéré"
  poids_max_par_titre: 0.15
  part_risque_max_par_titre: 0.25
  volatilite_max: 0.12
  pire_baisse_max: -0.20
  obligations_min: 0.20
  crypto_max: 0.0
  paris_effectifs_min: null
eleve:
  label: "Élevé"
  poids_max_par_titre: 0.25
  part_risque_max_par_titre: 0.30
  volatilite_max: 0.25
  pire_baisse_max: -0.45
  obligations_min: 0.0
  crypto_max: 0.10
  paris_effectifs_min: 2.0
