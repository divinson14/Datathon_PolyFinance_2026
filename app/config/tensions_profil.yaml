# Tensions entre la DEMANDE et les préférences TEXTUELLES du persona (champs « preferences » et « objectif »
# de config/personas/*.json). Choix de l'ÉQUIPE. Ce ne sont PAS des règles du mandat : elles n'entrent
# jamais dans le verdict (conforme / corrigeable / impossible), elles sont seulement signalées.
#
# Pour chaque tension : si un motif (regex, texte sans accents, en minuscules) est trouvé dans une préférence
# ET que la condition sur l'actif demandé est vraie, la tension est signalée en citant la préférence.
#
# Conditions possibles (calculées par le code, à partir des traces) :
#   cryptoactif        l'actif demandé est de classe « crypto »
#   titre_tres_volatil l'actif est un titre individuel dont la volatilité seule dépasse volatilite_titre_tres_volatil
#   esg_incertain      l'actif est un titre individuel marqué « controverse » ou non évalué (data/raw/added/esg_controverses.csv)
#   concentration      la règle « Part du risque max par titre » est violée par la demande

# Hypothèse de l'équipe : au-delà de 40 % de volatilité annualisée (seul, en CAD), un titre est « très volatil »
# (ordre de grandeur : un indice d'actions large est autour de 15 %).
volatilite_titre_tres_volatil: 0.40

tensions:
  - condition: cryptoactif
    motifs: ["peu interesse.*crypto", "evite.*crypto", "pas de crypto", "speculatif"]
  - condition: titre_tres_volatil
    motifs: ["etablie", "stabilite", "qualite", "preserver", "speculatif", "prudent"]
  - condition: esg_incertain
    motifs: ["esg", "controverse"]
  - condition: concentration
    motifs: ["diversifi"]
