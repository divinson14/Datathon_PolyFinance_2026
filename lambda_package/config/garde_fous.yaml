# Garde-fous de FORMULATION, vérifiés par le code (src/verif/fidelite.py), sans LLM.
# Le système décrit des LIMITES ; il ne conseille pas (énoncé : « ne pas se présenter comme
# fournissant un conseil financier personnalisé »). Toute réponse contenant une de ces
# expressions est rejetée et régénérée, exactement comme un chiffre absent des traces.
# Comparaison en minuscules, sans accents, mot entier.
expressions_conseil:
  - tu devrais
  - vous devriez
  - je te recommande
  - je vous recommande
  - je recommande
  - nous recommandons
  - on te recommande
  - je te conseille
  - je vous conseille
  - nous conseillons
  - je te suggere
  - je vous suggere
  - mets plutot
  - mettez plutot
  - investis plutot
  - investissez plutot
  - achete
  - achetez
  - vends
  - vendez
  - optez pour
  - opte pour
  - privilegie
  - privilegiez
  - la meilleure option
  - une option plus equilibree
  - il faut investir
