<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1490 880" width="1490" height="880" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect width="1490" height="880" fill="#ffffff"/>

  <!-- Titre -->
  <text x="30" y="42" font-size="24" font-weight="700" fill="#1b1b1b">InvestIA — architecture de la solution</text>
  <text x="30" y="66" font-size="13.5" fill="#555">Orchestration déterministe ; les agents décident et expliquent ; les chiffres et les seuils ne viennent jamais du LLM ; chaque étape laisse une trace.</text>

  <!-- Légende -->
  <g font-size="12" fill="#333" transform="translate(190,0)">
    <rect x="860" y="30" width="14" height="14" rx="3" fill="#ece6fb" stroke="#6b4fc4"/><text x="880" y="41">Agent (LLM)</text>
    <rect x="970" y="30" width="14" height="14" rx="3" fill="#fff1e0" stroke="#e07b00"/><text x="990" y="41">Service AWS</text>
    <rect x="1080" y="30" width="14" height="14" rx="3" fill="#e8f5ec" stroke="#2e8b57"/><text x="1100" y="41">Code déterministe</text>
    <rect x="860" y="52" width="14" height="14" rx="3" fill="#e6f0fb" stroke="#2f6db5"/><text x="880" y="63">Données</text>
    <line x1="970" y1="59" x2="1000" y2="59" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4"/><text x="1006" y="63">Boucle de correction</text>
  </g>

  <!-- Utilisateur + interface -->
  <rect x="30" y="250" width="180" height="70" rx="10" fill="#f4f4f4" stroke="#888"/>
  <text x="120" y="280" font-size="15" font-weight="700" text-anchor="middle" fill="#222">Utilisateur</text>
  <text x="120" y="301" font-size="12" text-anchor="middle" fill="#555">Amira · Mateo · Robert</text>
  <line x1="120" y1="320" x2="120" y2="368" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="30" y="370" width="180" height="112" rx="10" fill="#fff1e0" stroke="#e07b00" stroke-width="1.6"/>
  <text x="120" y="396" font-size="15" font-weight="700" text-anchor="middle" fill="#222">Interface Streamlit</text>
  <text x="120" y="418" font-size="12" text-anchor="middle" fill="#555">choix du persona</text>
  <text x="120" y="436" font-size="12" text-anchor="middle" fill="#555">demande en langage naturel</text>
  <text x="120" y="454" font-size="12" text-anchor="middle" fill="#555">fiche de décision cliquable</text>
  <text x="120" y="472" font-size="11" font-style="italic" text-anchor="middle" fill="#8a5a00">local ou Amazon EC2</text>

  <!-- AWS -->
  <rect x="250" y="84" width="1020" height="760" rx="14" fill="none" stroke="#e07b00" stroke-width="2" stroke-dasharray="9 6"/>
  <rect x="262" y="76" width="44" height="18" rx="4" fill="#e07b00"/>
  <text x="284" y="89.5" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">AWS</text>

  <!-- Bedrock -->
  <rect x="280" y="116" width="510" height="574" rx="12" fill="#fffaf3" stroke="#e07b00" stroke-width="1.6"/>
  <text x="300" y="140" font-size="14" font-weight="700" fill="#8a4b00">Orchestrateur Python (déterministe) · agents via Amazon Bedrock</text>

  <rect x="300" y="156" width="470" height="44" rx="8" fill="#fff1e0" stroke="#e07b00"/>
  <text x="535" y="176" font-size="13" font-weight="700" text-anchor="middle" fill="#222">Bedrock Guardrails</text>
  <text x="535" y="193" font-size="11.5" text-anchor="middle" fill="#555">filtre entrées et sorties : simulation seulement, aucun conseil personnalisé</text>

  <!-- Agents -->
  <g>
    <rect x="370" y="230" width="370" height="80" rx="10" fill="#ece6fb" stroke="#6b4fc4" stroke-width="1.6"/>
    <text x="555" y="256" font-size="15" font-weight="700" text-anchor="middle" fill="#2c1d6b">1 · Agent Profil</text>
    <text x="555" y="277" font-size="12" text-anchor="middle" fill="#444">extrait la demande et choisit le gabarit de risque</text>
    <text x="555" y="295" font-size="12" text-anchor="middle" fill="#444">signale les informations manquantes au lieu de les inventer</text>

    <rect x="370" y="340" width="370" height="80" rx="10" fill="#ece6fb" stroke="#6b4fc4" stroke-width="1.6"/>
    <text x="555" y="366" font-size="15" font-weight="700" text-anchor="middle" fill="#2c1d6b">2 · Agent Analyste</text>
    <text x="555" y="387" font-size="12" text-anchor="middle" fill="#444">appelle les outils de calcul, compare les actifs</text>
    <text x="555" y="405" font-size="12" text-anchor="middle" fill="#444">propose une allocation fictive (max. 3 tentatives)</text>

    <rect x="370" y="450" width="370" height="80" rx="10" fill="#ece6fb" stroke="#6b4fc4" stroke-width="1.6"/>
    <text x="555" y="476" font-size="15" font-weight="700" text-anchor="middle" fill="#2c1d6b">3 · Agent Gouvernance</text>
    <text x="555" y="497" font-size="12" text-anchor="middle" fill="#444">verdicts : respecté / violé / information manquante</text>
    <text x="555" y="515" font-size="12" text-anchor="middle" fill="#444">ex. Robert → poche satellite plafonnée, risque expliqué</text>

    <rect x="370" y="560" width="370" height="80" rx="10" fill="#ece6fb" stroke="#6b4fc4" stroke-width="1.6"/>
    <text x="555" y="586" font-size="15" font-weight="700" text-anchor="middle" fill="#2c1d6b">4 · Agent Explicabilité</text>
    <text x="555" y="607" font-size="12" text-anchor="middle" fill="#444">fiche de décision : Fait / Hypothèse / Scénario fictif</text>
    <text x="555" y="625" font-size="12" text-anchor="middle" fill="#444">ID de trace par affirmation · style selon le niveau</text>
  </g>

  <!-- Flux vertical -->
  <g stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="555" y1="200" x2="555" y2="228"/>
    <line x1="555" y1="310" x2="555" y2="338"/>
    <line x1="555" y1="420" x2="555" y2="448"/>
    <line x1="555" y1="530" x2="555" y2="558"/>
  </g>
  <g font-size="11" fill="#666">
    <text x="563" y="328">mandat</text>
    <text x="563" y="438">allocation + calculs</text>
    <text x="563" y="548">verdicts</text>
  </g>

  <!-- Boucle de correction -->
  <path d="M370,500 H322 V380 H366" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text transform="translate(312,440) rotate(-90)" font-size="11.5" font-weight="700" text-anchor="middle" fill="#c0392b">violation → réajuster</text>

  <!-- Demande / réponse -->
  <path d="M210,400 H234 V178 H298" fill="none" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="140" y="352" font-size="11.5" font-weight="700" fill="#333" transform="translate(0,0)"></text>
  <rect x="224" y="214" width="20" height="62" fill="#ffffff"/>
  <text transform="translate(238,245) rotate(-90)" font-size="11.5" font-weight="700" text-anchor="middle" fill="#333">demande</text>

  <path d="M370,612 H120 V484" fill="none" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="140" y="604" font-size="11.5" font-weight="700" fill="#333">réponse + preuves cliquables</text>

  <!-- Colonne outils -->
  <rect x="840" y="230" width="210" height="80" rx="10" fill="#e6f0fb" stroke="#2f6db5" stroke-width="1.4"/>
  <text x="945" y="254" font-size="14" font-weight="700" text-anchor="middle" fill="#123d6b">Mandat JSON</text>
  <text x="945" y="274" font-size="11.5" text-anchor="middle" fill="#444">seuils du gabarit (équipe)</text>
  <text x="945" y="291" font-size="11.5" text-anchor="middle" fill="#444">+ demande · infos manquantes</text>
  <line x1="740" y1="270" x2="838" y2="270" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="840" y="330" width="210" height="104" rx="10" fill="#fff1e0" stroke="#e07b00" stroke-width="1.6"/>
  <text x="945" y="354" font-size="14" font-weight="700" text-anchor="middle" fill="#222">AWS Lambda — outils</text>
  <text x="945" y="375" font-size="11.5" text-anchor="middle" fill="#444">rendement · volatilité</text>
  <text x="945" y="392" font-size="11.5" text-anchor="middle" fill="#444">pire baisse · corrélations</text>
  <text x="945" y="409" font-size="11.5" text-anchor="middle" fill="#444">rejeu 2022 (+ série mensuelle)</text>
  <text x="945" y="426" font-size="11.5" text-anchor="middle" fill="#444">conversion USD → CAD</text>
  <line x1="740" y1="380" x2="838" y2="380" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="1080" y="300" width="170" height="164" rx="10" fill="#e6f0fb" stroke="#2f6db5" stroke-width="1.6"/>
  <text x="1165" y="324" font-size="14" font-weight="700" text-anchor="middle" fill="#123d6b">Amazon S3</text>
  <text x="1165" y="346" font-size="11" text-anchor="middle" fill="#444">prices_daily</text>
  <text x="1165" y="362" font-size="11" text-anchor="middle" fill="#444">assets_universe</text>
  <text x="1165" y="378" font-size="11" text-anchor="middle" fill="#444">fx_usdcad · macro_rates</text>
  <text x="1165" y="394" font-size="11" text-anchor="middle" fill="#444">corporate_actions</text>
  <text x="1165" y="410" font-size="11" text-anchor="middle" fill="#444">sources_metadata</text>
  <text x="1165" y="432" font-size="11" font-weight="700" text-anchor="middle" fill="#2f6db5">+ ESG ajouté</text>
  <text x="1165" y="448" font-size="10.5" text-anchor="middle" fill="#2f6db5">(FNB ESG, controverses)</text>
  <line x1="1050" y1="380" x2="1078" y2="380" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="840" y="450" width="210" height="80" rx="10" fill="#e8f5ec" stroke="#2e8b57" stroke-width="1.6"/>
  <text x="945" y="475" font-size="14" font-weight="700" text-anchor="middle" fill="#1d5c39">Moteur de règles</text>
  <text x="945" y="495" font-size="11.5" text-anchor="middle" fill="#444">Python, sans LLM</text>
  <text x="945" y="512" font-size="11.5" text-anchor="middle" fill="#444">compare allocation ↔ mandat</text>
  <line x1="740" y1="490" x2="838" y2="490" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="840" y="560" width="210" height="80" rx="10" fill="#e8f5ec" stroke="#2e8b57" stroke-width="1.6"/>
  <text x="945" y="585" font-size="14" font-weight="700" text-anchor="middle" fill="#1d5c39">Vérificateur de fidélité</text>
  <text x="945" y="605" font-size="11.5" text-anchor="middle" fill="#444">chaque chiffre du texte</text>
  <text x="945" y="622" font-size="11.5" text-anchor="middle" fill="#444">existe-t-il dans les traces ?</text>
  <line x1="740" y1="600" x2="838" y2="600" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- DynamoDB -->
  <rect x="280" y="736" width="970" height="84" rx="12" fill="#fff1e0" stroke="#e07b00" stroke-width="1.6"/>
  <text x="765" y="764" font-size="15" font-weight="700" text-anchor="middle" fill="#222">Amazon DynamoDB — journal d'audit (traces)</text>
  <text x="765" y="785" font-size="12" text-anchor="middle" fill="#444">chaque appel d'outil, chaque verdict et chaque source est enregistré avec un ID, une date et ses entrées/sorties</text>
  <text x="765" y="804" font-size="12" text-anchor="middle" fill="#444">→ l'explication ne cite que ce qui a réellement été calculé (aucune justification inventée après coup)</text>

  <g stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="420" y1="690" x2="420" y2="734"/>
    <line x1="945" y1="640" x2="945" y2="734"/>
  </g>
  <line x1="660" y1="736" x2="660" y2="642" stroke="#2f6db5" stroke-width="1.8" marker-end="url(#a)"/>
  <g font-size="11" fill="#666">
    <text x="428" y="716">écrit les traces</text>
    <text x="953" y="700">écrit les traces</text>
    <text x="668" y="716" fill="#2f6db5" font-weight="700">lit les traces</text>
  </g>

  <!-- Config équipe -->
  <rect x="840" y="116" width="210" height="88" rx="10" fill="#e6f0fb" stroke="#2f6db5" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="945" y="139" font-size="13.5" font-weight="700" text-anchor="middle" fill="#123d6b">config/ — fixé par l'équipe</text>
  <text x="945" y="159" font-size="11.5" text-anchor="middle" fill="#444">gabarits de risque (seuils)</text>
  <text x="945" y="176" font-size="11.5" text-anchor="middle" fill="#444">personas · styles d'explication</text>
  <text x="945" y="193" font-size="11" font-style="italic" text-anchor="middle" fill="#2f6db5">hypothèses documentées</text>
  <line x1="945" y1="204" x2="945" y2="228" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- Repo données -->
  <rect x="1295" y="300" width="180" height="164" rx="10" fill="#e8f5ec" stroke="#2e8b57" stroke-width="1.6"/>
  <text x="1385" y="322" font-size="13" font-weight="700" text-anchor="middle" fill="#1d5c39">Repo alphaforge-data</text>
  <text x="1385" y="340" font-size="10.5" font-style="italic" text-anchor="middle" fill="#1d5c39">lancé une fois, avant tout</text>
  <text x="1385" y="362" font-size="11" text-anchor="middle" fill="#444">alignement calendriers</text>
  <text x="1385" y="378" font-size="11" text-anchor="middle" fill="#444">(crypto 7 j / actions 5 j)</text>
  <text x="1385" y="394" font-size="11" text-anchor="middle" fill="#444">conversion en CAD</text>
  <text x="1385" y="410" font-size="11" text-anchor="middle" fill="#444">drapeaux ESG</text>
  <text x="1385" y="426" font-size="11" text-anchor="middle" fill="#444">rapport de qualité</text>
  <line x1="1295" y1="382" x2="1252" y2="382" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="1255" y="363" width="38" height="14" fill="#ffffff"/><text x="1274" y="374" font-size="10" text-anchor="middle" fill="#666">dépose</text>

  <!-- Tests -->
  <rect x="30" y="650" width="190" height="110" rx="10" fill="#e8f5ec" stroke="#2e8b57" stroke-width="1.6"/>
  <text x="125" y="674" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1d5c39">Tests de comportement</text>
  <text x="125" y="695" font-size="11.5" text-anchor="middle" fill="#444">~15 scénarios piégés</text>
  <text x="125" y="712" font-size="11.5" text-anchor="middle" fill="#444">(Robert 30 % Tesla,</text>
  <text x="125" y="729" font-size="11.5" text-anchor="middle" fill="#444">Amira 100 % crypto…)</text>
  <text x="125" y="748" font-size="11" font-style="italic" text-anchor="middle" fill="#1d5c39">→ tableau pour la doc</text>
  <path d="M220,672 H278" fill="none" stroke="#2e8b57" stroke-width="1.6" marker-end="url(#a)"/>
</svg>
