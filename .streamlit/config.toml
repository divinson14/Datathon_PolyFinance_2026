# Copie de app/.streamlit/config.toml : lue quand l'application est lancée depuis la RACINE du dépôt (déploiement).
# Sans ce fichier, Streamlit suit le mode sombre du système et les couleurs de l'interface (prévues pour un fond clair) se mélangent.
# Thème AlphaForge (sobre, clair). Lu par « streamlit run » lancé depuis app/.
[theme]
base = "light"
primaryColor = "#1F6FEB"
backgroundColor = "#F7F7F5"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#111111"
font = "sans serif"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false
